[project]
name = "cortana-brain"
version = "0.37.0"
description = "Local-first, agent-native second brain with configurable ingestion and hybrid retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "0xPlayerOne" }]
dependencies = [
  "httpx>=0.28,<1",
]

[project.scripts]
cortana-connectors = "cortana.connectors.__main__:entrypoint"

[project.optional-dependencies]
ingestion = [
  "pypdf[crypto]>=6.15.0,<7",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortana"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that exercise cross-process, packaging, or installer boundaries",
  "smoke: bounded source and runtime health probes",
]

[tool.coverage.run]
branch = true
source = ["cortana"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cortana"]
