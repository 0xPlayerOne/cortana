[project]
name = "cortana-brain"
version = "0.1.0"
description = "Local-first, agent-native second brain with configurable ingestion and hybrid retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "0xPlayerOne" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pydantic-settings>=2.10,<3",
  "pydantic>=2.11,<3",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]
ingestion = [
  "google-api-python-client>=2.176,<3",
  "google-auth-oauthlib>=1.2,<2",
  "markdownify>=1.1,<2",
  "pypdf>=5.8,<6",
]
hindsight = ["hindsight-api>=0.8.5,<0.9"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortana"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cortana"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cortana"]
