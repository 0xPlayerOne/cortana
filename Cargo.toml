[package]
name = "cortana"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first, agent-native second brain with configurable ingestion and hybrid retrieval"
license = "AGPL-3.0-only"
repository = "https://github.com/0xPlayerOne/cortana"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v5"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
