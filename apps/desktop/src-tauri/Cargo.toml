[package]
name = "cortana-desktop"
version = "0.29.44"
edition = "2024"
rust-version = "1.88"
description = "Tauri control plane for the Cortana local second brain"
license = "AGPL-3.0-only"
repository = "https://github.com/0xPlayerOne/cortana"

[lib]
name = "cortana_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cortana-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0"
open = "5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["image-png", "test", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = { version = "2.10.1", features = ["rustls-tls"] }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "time"] }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"

[patch.crates-io]
# Tauri's GTK3 Linux stack requires glib 0.18.5. This local crate applies the exact upstream
# VariantStrIter soundness fix while GTK3 prevents upgrading to glib 0.20.
glib = { path = "../../../third_party/glib-0.18.5" }
