# Copy to ~/.config/cortana/config.toml. Keep tokens outside this file.
data_dir = "/Users/you/Library/Application Support/cortana"

[runtime]
# Optional KEY=VALUE file. Cortana refuses this file unless its Unix mode is 0600.
# Process environment variables take precedence over entries in this file.
# env_file = "/Users/you/.config/cortana/secrets.env"

[embedding]
# Existing local Qwen/TEI profile. Any OpenAI-compatible cloud endpoint also works.
base_url = "http://127.0.0.1:6999/v1"
model = "Qwen/Qwen3-Embedding-0.6B"
dimension = 1024
# Least-recently-used vectors beyond this count are pruned after a cache write.
cache_max_entries = 250000
# Bounds a wedged local router or cloud request before the retry policy takes over.
request_timeout_seconds = 180
# Parallel requests improve local throughput; cloud providers can lower this to match rate limits.
request_concurrency = 4
# api_key_env = "CORTANA_EMBEDDING_API_KEY"

[embedding.service]
# `cortana embedding-service` supervises this command. When omitted it derives a local
# text-embeddings-router command from the model and base URL above.
# command = ["/absolute/path/text-embeddings-router", "--model-id", "Qwen/Qwen3-Embedding-0.6B", "--dtype", "float16", "--hostname", "127.0.0.1", "--port", "6999", "--max-batch-tokens", "4096", "--max-batch-requests", "16", "--max-concurrent-requests", "128"]
startup_timeout_seconds = 120
memory_limit_mb = 4096

[query]
# The HTTP API and workspace always expose /v1/answer. With synthesis disabled, Cortana uses
# deterministic single-query retrieval and a citation-stable extractive answer.
synthesis_enabled = false
# Enable this after an OpenAI-compatible model gateway or cloud provider has been verified.
base_url = "http://127.0.0.1:8008/v1"
model = "auto-efficient"
# api_key_env = "CORTANA_QUERY_API_KEY"
# Planner output and retrieval fan-out are hard-clamped by the runtime.
max_planned_queries = 4
retrieval_limit = 10
result_limit = 20
context_tokens = 8000
output_tokens = 1200
request_timeout_seconds = 45
# Hard end-to-end deadline; clamped below the API's 60-second request timeout.
answer_timeout_seconds = 55
request_concurrency = 4
# Answers are invalidated whenever indexed content, timestamps, or the embedding fingerprint
# changes. Set either value to 0 to disable reuse without deleting prior cache rows.
cache_max_entries = 10000
cache_ttl_seconds = 3600

[hindsight]
# Optional sidecar for memory outbox export. Disabled by default and never wired to
# normal source ingestion. The default local server listens on Hindsight's port 8888.
enabled = false
provider = "hindsight"
base_url = "http://127.0.0.1:8888"
bank = "default"
# token_env = "CORTANA_HINDSIGHT_TOKEN"
optional = true
wired_to_ingestion = false

[honcho]
# Optional session sidecar for deliberately selected agent episodes. Disabled by default and
# never wired to normal source ingestion. See docs/memory-honcho.md.
enabled = false
provider = "honcho"
base_url = "https://api.honcho.dev"
workspace_id = "default"
peer_id = "cortana"
session_prefix = "cortana"
# token_env = "CORTANA_HONCHO_TOKEN"
optional = true
wired_to_ingestion = false

[auth]
# Query audit stores metadata only (never query text, evidence, or tokens).
audit_max_events = 10000

# Optional multi-principal bearer tokens. Values come only from the environment/private env file.
# When no tokens are configured, the loopback-only server uses an implicit local owner.
# [[auth.tokens]]
# principal = "shared-agent"
# token_env = "CORTANA_SHARED_AGENT_TOKEN"
# scopes = ["query", "status"]
# acl = ["work", "shared"]

[ingestion]
# Every source must pass a complete preflight before Cortana embeds or reconciles it.
# These conservative defaults bound first-run and unexpectedly expanded snapshots.
max_documents_per_source = 2000
max_bytes_per_source = 134217728
max_duration_seconds = 900
document_batch_size = 16
# Keep ingestion below query capacity so agents retain responsive retrieval.
request_concurrency = 1
# A successful source validation stays current for this long. Recurring sync
# installation, `sync --require-validation`, and readiness
# (`--allow-sync-service`) refuse a validation older than the bound so a
# revoked credential or changed scope cannot keep a stale record blessing the
# schedule; set 0 to accept any age.
validation_max_age_hours = 168
# A successful sync older than this is shown as stale in operational source health.
# Set 0 to disable the stale-sync warning (it does not disable validation freshness).
sync_freshness_hours = 48

[connectors]
# Change this when Cortana is installed into a dedicated virtual environment.
command = ["uv", "run", "python", "-m", "cortana.connectors"]
# Prevent a wedged external API process from holding the single-writer sync lock forever.
timeout_seconds = 21600

[[sources]]
name = "work-code"
kind = "filesystem"
project = "work"
root = "/absolute/path/to/code"
source = "work-code"
acl = ["work"]
# Relative paths to omit from this source. Generated directories are always skipped.
exclude = ["second-brain"]
# Optional tighter or larger source-specific budgets.
# max_documents = 1000
# max_bytes = 67108864
# max_duration_seconds = 600

[[sources]]
name = "personal-notes"
kind = "apple-notes"
project = "personal"

[[sources]]
name = "personal-drive"
kind = "google-drive"
project = "personal"
token = "/secure/path/google-token.json"
oauth_client = "/secure/path/google-desktop-client.json"
query = "trashed = false"
# Sample the beginning and end of very large exports instead of embedding them verbatim.
max_content_chars = 50000

[[sources]]
name = "personal-gmail"
kind = "gmail"
project = "personal"
token = "/secure/path/google-token.json"
query = "newer_than:5y"

[[sources]]
name = "personal-calendar"
kind = "google-calendar"
project = "personal"
token = "/secure/path/google-token.json"

[[sources]]
name = "work-github"
kind = "github"
project = "work"
repositories = ["0xPlayerOne/cortana"]
# For browser authorization, provide a GitHub OAuth app client-id JSON and a
# private token destination instead of token_env. The Desktop chooser can
# create the destination file after authorization.
# token = "/secure/path/github-token.json"
# oauth_client = "/secure/path/github-oauth-client.json"
token_env = "GITHUB_TOKEN"

[[sources]]
name = "team-slack"
kind = "slack"
project = "work"
channels = ["C0123456789"]
token_env = "SLACK_BOT_TOKEN"
# Optional browser authorization for per-workspace workspace assignment. The
# OAuth client JSON holds the Slack app `client_id` (and optionally
# `client_secret`); `token` is the private user-token file Cortana creates
# after consent. The bot token above stays required for channel selection and
# message sync. `teams` records the workspace assigned to this source (at
# most one, because a Slack user token is scoped to exactly one workspace)
# and `team_names` keeps its display name. Register the exact loopback
# redirect URI http://127.0.0.1:47521/callback in the Slack app first.
# teams = ["T0123456789"]
# team_names = ["Acme Engineering"]
# token = "/Users/you/.config/cortana/slack-user-token.json"
# oauth_client = "/Users/you/.config/cortana/slack-oauth-client.json"

[[sources]]
name = "community-discord"
kind = "discord"
project = "community"
channels = ["123456789012345678"]
token_env = "DISCORD_BOT_TOKEN"
# Optional browser authorization for per-workspace server assignment. The
# OAuth client JSON holds the Discord application `client_id` (and optionally
# `client_secret`); `token` is the private user-token file Cortana creates
# after consent. The bot token above stays required for channel listing and
# sync. `servers` records the guilds assigned to this source's workspace.
# servers = ["987654321098765432"]
# token = "/Users/you/.config/cortana/discord-user-token.json"
# oauth_client = "/Users/you/.config/cortana/discord-oauth-client.json"

[[sources]]
name = "buzz"
kind = "buzz"
project = "agents"
root = "/Users/you/Library/Application Support/xyz.block.buzz.app"

# Any command that emits one normalized Document JSON object per line can plug in.
# [[sources]]
# name = "custom"
# kind = "external"
# project = "work"
# command = ["/absolute/path/to/connector", "--jsonl"]
