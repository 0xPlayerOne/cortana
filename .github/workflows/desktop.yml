name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/verify-vendored-glib.mjs'
      - 'third_party/glib-0.18.5/**'
  # Explicit manual final audit path: dispatch this workflow to force the
  # Linux release compilation on any branch, independent of PR state.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The former sequential job is split into independent jobs: parallel
  # execution cuts wall-clock time, but every job repeats setup, so total
  # runner minutes rise.
  audit:
    name: Audit / Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      - name: Install cargo-audit
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify patched GTK dependency provenance
        run: bun scripts/verify-vendored-glib.mjs
      - name: Test patched GTK iterator in release mode
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo test --manifest-path third_party/glib-0.18.5/Cargo.toml --release --lib variant_iter
      - name: Audit desktop Rust dependencies
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  quality:
    name: Web + Desktop Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      - name: Check web
        run: |
          bun run typecheck
          bun run build
      - name: Test desktop
        run: bun run desktop:test
      - name: Lint desktop
        run: bun run --cwd apps/desktop clippy

  release:
    name: Release Compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      # Linux release compilation is reserved for PRs targeting main and explicit
      # manual final audits (workflow_dispatch). It is intentionally skipped on
      # staging PRs, ordinary feature PRs, and Release Please version-only PRs.
      - name: Compile release desktop
        # Final gate: run only for PRs targeting main and manual dispatch,
        # excluding release-please version PRs. This skips final audit steps
        # for staging and feature PRs while preserving manual audits.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        env:
          CORTANA_DESKTOP_TARGET: x86_64-unknown-linux-gnu
        run: bun run desktop:build

  # Fast aggregate carrying the stable required check name. It runs even when
  # a dependency fails so the check turns red instead of silently skipping.
  aggregate:
    name: Tauri 2 / Linux
    needs: [audit, quality, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any desktop job failed
        if: >-
          needs.audit.result != 'success' ||
          needs.quality.result != 'success' ||
          needs.release.result != 'success'
        run: exit 1
      - name: All desktop jobs passed
        run: echo "audit/provenance, web+desktop quality, and release compilation all passed"
