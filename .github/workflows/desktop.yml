name: Desktop

on:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/verify-vendored-glib.mjs'
      - 'third_party/glib-0.18.5/**'
  push:
    branches: [main, staging]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/verify-vendored-glib.mjs'
      - 'third_party/glib-0.18.5/**'
  # Explicit manual final audit path: dispatch this workflow to force the
  # Linux release compilation on any branch, independent of PR state.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tauri 2 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install cargo-audit
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify patched GTK dependency provenance
        run: bun scripts/verify-vendored-glib.mjs
      - name: Test patched GTK iterator in release mode
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo test --manifest-path third_party/glib-0.18.5/Cargo.toml --release --lib variant_iter
      - name: Audit desktop Rust dependencies
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Check web
        run: |
          bun run typecheck
          bun run build
      - name: Test desktop
        run: bun run desktop:test
      - name: Lint desktop
        run: bun run --cwd apps/desktop clippy
      # Linux release compilation is reserved for PRs targeting main and explicit
      # manual final audits (workflow_dispatch). It is intentionally skipped on
      # staging PRs, ordinary feature PRs, and Release Please version-only PRs.
      - name: Compile release desktop
        # Final gate: run only for PRs targeting main and manual dispatch,
        # excluding release-please version PRs. This skips final audit steps
        # for staging and feature PRs while preserving manual audits.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        env:
          CORTANA_DESKTOP_TARGET: x86_64-unknown-linux-gnu
        run: bun run desktop:build
