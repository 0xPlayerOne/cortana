name: Desktop

on:
  pull_request:
    branches: [main]
  # Explicit manual final audit path: dispatch this workflow to force the
  # Linux release compilation on any branch, independent of PR state.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required aggregate check present on every main PR without
  # starting the expensive desktop jobs for backend-only changes.
  changes:
    name: Detect desktop changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect desktop paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/desktop.yml|apps/desktop/*|apps/web/*|bun.lock|package.json|Cargo.toml|Cargo.lock|rust-toolchain.toml|src/*|eval/*|CHANGELOG.md|pyproject.toml|uv.lock|README.md|LICENSE|scripts/prepare-desktop-resources.mjs|scripts/prepare-desktop-sidecar.mjs|scripts/verify-vendored-glib.mjs|third_party/glib-0.18.5/*)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "desktop=$changed" >> "$GITHUB_OUTPUT"

  # GTK provenance checks are independent from the iterator test, so run
  # them in parallel to avoid one expensive Rust test blocking the other.
  gtk_provenance:
    name: GTK Provenance
    needs: changes
    # Job-level final-audit gate: run only for PRs targeting main and manual
    # dispatch, excluding release-please version PRs.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      - name: Verify patched GTK dependency provenance
        run: bun scripts/verify-vendored-glib.mjs

  # Keep the patched GTK iterator test independent from provenance checks so a
  # single failing check does not hide unrelated status in the other.
  gtk_iterator:
    name: GTK iterator (release)
    needs: changes
    # Job-level final-audit gate: run only for PRs targeting main and manual
    # dispatch, excluding release-please version PRs.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      - name: Test patched GTK iterator in release mode
        run: cargo test --manifest-path third_party/glib-0.18.5/Cargo.toml --release --lib variant_iter

  security_audit:
    name: Security Audit (cargo-audit)
    needs: changes
    # Keep the dependency scan independent from the provenance and build
    # setup. It needs only the lockfile and the pinned cargo-audit binary;
    # the Rust cache accelerates cold cargo-audit compiles.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Compiling cargo-audit from source on a cold binary-cache miss needs
      # the same Rust registry cache as the other jobs, so reuse it here.
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      # Warm the exact pinned binary under a stable per-OS/arch key so
      # repeated final audits restore cargo-audit without recompiling it.
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit desktop Rust dependencies
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  # Keep desktop tests and clippy in separate jobs so a lint failure does not
  # delay test-only feedback, and a test-only fail does not block clippy output.
  desktop_test:
    name: Desktop Tests
    needs: changes
    # Job-level final-audit gate: run only for PRs targeting main and manual
    # dispatch, excluding release-please version PRs.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      # Web typecheck/build is owned by Code Foundry Validation / CI, which
      # already runs `bun run typecheck` and `bun run build` on the same
      # main-targeting PR SHA. This job keeps only desktop tests.
      - name: Test desktop
        run: bun run desktop:test

  desktop_clippy:
    name: Desktop Clippy
    needs: changes
    # Job-level final-audit gate: run only for PRs targeting main and manual
    # dispatch, excluding release-please version PRs.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      # Web typecheck/build is owned by Code Foundry Validation / CI, which
      # already runs `bun run typecheck` and `bun run build` on the same
      # main-targeting PR SHA. This job keeps only desktop clippy.
      - name: Lint desktop
        run: bun run --cwd apps/desktop clippy

  release:
    name: Release Compilation
    needs: changes
    # Job-level final-audit gate: run only for PRs targeting main and manual
    # dispatch, excluding release-please version PRs.
    if: >-
      needs.changes.outputs.desktop == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-
      # Linux release compilation is reserved for PRs targeting main and explicit
      # manual final audits (workflow_dispatch). It is intentionally skipped on
      # staging PRs, ordinary feature PRs, and Release Please version-only PRs.
      - name: Compile release desktop
        # Final gate: run only for PRs targeting main and manual dispatch,
        # excluding release-please version PRs. This skips final audit steps
        # for staging and feature PRs while preserving manual audits.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.base.ref == 'main' &&
           !startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
        env:
          CORTANA_DESKTOP_TARGET: x86_64-unknown-linux-gnu
        run: bun run desktop:build

  # Fast aggregate carrying the stable required check name. It always runs
  # after its dependencies so the check turns red on failure or cancellation
  # instead of silently skipping. Skipped dependencies (release-please
  # version-only PRs) are acceptable and leave the check green.
  aggregate:
    name: Tauri 2 / Linux
    needs:
      [changes, gtk_provenance, gtk_iterator, security_audit, desktop_test, desktop_clippy, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any desktop job failed or was cancelled
        if: >-
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.gtk_provenance.result == 'failure' || needs.gtk_provenance.result == 'cancelled' ||
          needs.gtk_iterator.result == 'failure' || needs.gtk_iterator.result == 'cancelled' ||
          needs.security_audit.result == 'failure' || needs.security_audit.result == 'cancelled' ||
          needs.desktop_test.result == 'failure' || needs.desktop_test.result == 'cancelled' ||
          needs.desktop_clippy.result == 'failure' || needs.desktop_clippy.result == 'cancelled' ||
          needs.release.result == 'failure' || needs.release.result == 'cancelled'
        run: exit 1
      - name: All desktop jobs passed or were skipped
        run: echo "security audit, GTK provenance, GTK iterator, desktop tests, clippy, and release compilation passed or were skipped"
