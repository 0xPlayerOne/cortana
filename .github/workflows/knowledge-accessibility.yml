name: Knowledge accessibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-accessibility.yml'
      - 'apps/web/**'
      - 'scripts/knowledge-accessibility-acceptance.mjs'
      - 'scripts/knowledge-accessibility-browser.mjs'
      - 'scripts/knowledge-accessibility-browser.test.mjs'
      - 'scripts/knowledge-accessibility-matrix.mjs'
      - 'scripts/knowledge-accessibility-matrix.test.mjs'
      - 'scripts/static-web-server.mjs'
      - 'scripts/static-web-server.test.mjs'
      - 'bun.lock'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-accessibility.yml'
      - 'apps/web/**'
      - 'scripts/knowledge-accessibility-acceptance.mjs'
      - 'scripts/knowledge-accessibility-browser.mjs'
      - 'scripts/knowledge-accessibility-browser.test.mjs'
      - 'scripts/knowledge-accessibility-matrix.mjs'
      - 'scripts/knowledge-accessibility-matrix.test.mjs'
      - 'scripts/static-web-server.mjs'
      - 'scripts/static-web-server.test.mjs'
      - 'bun.lock'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-accessibility-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Chromium, axe, keyboard, and zoom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build production renderer
        run: bun run build
      - name: Resolve standalone renderer provenance
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          {
            echo "CORTANA_KNOWLEDGE_TARGET=x86_64-unknown-linux-gnu"
            echo "CORTANA_KNOWLEDGE_VERSION=$version"
            echo "CORTANA_KNOWLEDGE_REVISION=$GITHUB_SHA"
            echo "CORTANA_KNOWLEDGE_INSTALLATION_TYPE=prospective-source-renderer"
            echo "CORTANA_KNOWLEDGE_RUN_LARGE=true"
          } >> "$GITHUB_ENV"
      - name: Run knowledge accessibility acceptance
        env:
          CORTANA_KNOWLEDGE_SERVER: preview
        run: bun run test:knowledge-accessibility
      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-accessibility-${{ github.sha }}
          path: artifacts/knowledge-accessibility
          if-no-files-found: error
          retention-days: 30
