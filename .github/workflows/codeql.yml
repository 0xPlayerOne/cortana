name: Code Foundry

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
      runner: ubuntu-latest
    secrets: inherit
