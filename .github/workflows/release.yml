name: Code Foundry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    uses: 0xPlayerOne/code-foundry/.github/workflows/release.yml@v0.27.17
    with:
      runner: ubuntu-slim
    secrets: inherit

  assets:
    name: Release / Dispatch assets
    needs: release
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch assets for the release at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.target_commitish == env.GITHUB_SHA) | .tag_name' |
              head -n 1
          )"
          if [ -z "${tag}" ]; then
            echo "No release targets ${GITHUB_SHA}; skipping assets."
            exit 0
          fi
          gh workflow run release-assets.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f "tag=${tag}"
