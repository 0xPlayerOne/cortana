name: M7 visual evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/capture-m7-visuals.mjs'
      - 'bun.lock'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-visual-evidence-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start deterministic renderer
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/cortana-vite.log" 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/cortana-vite.log"
          exit 1
      - name: Capture final shadcn application
        run: >-
          bun scripts/capture-m7-visuals.mjs
          --base-url http://127.0.0.1:4173
          --output artifacts/m7-shadcn/final
      - name: Stop deterministic renderer
        if: always()
        run: kill "$VITE_PID" 2>/dev/null || true
      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-visual-evidence-${{ github.sha }}
          path: |
            artifacts/m7-shadcn
            ${{ runner.temp }}/cortana-vite.log
          if-no-files-found: error
          retention-days: 30
