name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: Binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build release
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          bun install --frozen-lockfile
          bun run build
          uv build --wheel --out-dir dist
      - name: Package
        run: |
          archive="cortana-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "${archive}/bin" "${archive}/dist" "${archive}/share/cortana"
          cp "target/${{ matrix.target }}/release/cortana" "${archive}/bin/"
          cp -R apps/web/dist "${archive}/share/cortana/web"
          cp dist/*.whl "${archive}/dist/"
          cp scripts/install-release.sh "${archive}/install.sh"
          cp -R config.example.toml skills packaging scripts README.md LICENSE "${archive}/"
          test -x "${archive}/install.sh"
          test -f "${archive}/share/cortana/web/index.html"
          test -n "$(find "${archive}/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          "${archive}/install.sh" --help
          tar -czf "${archive}.tar.gz" "${archive}"
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" cortana-*.tar.gz cortana-*.sha256 --clobber

  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: Linux x64
            args: ''
          - runner: windows-latest
            platform: Windows x64
            args: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, sign, and upload desktop
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}
