name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: Binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Cache Rust and Bun build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            target
          key: >-
            ${{ runner.os }}-cortana-release-${{ matrix.target }}-
            ${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'bun.lock',
            'apps/desktop/package.json', 'apps/web/package.json',
            'third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cortana-release-${{ matrix.target }}-
            ${{ runner.os }}-cortana-release-
      - name: Build release
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          bun install --frozen-lockfile
          bun run build
          uv build --wheel --out-dir dist
      - name: Package
        run: |
          archive="cortana-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "${archive}/bin" "${archive}/dist" "${archive}/share/cortana"
          cp "target/${{ matrix.target }}/release/cortana" "${archive}/bin/"
          cp -R apps/web/dist "${archive}/share/cortana/web"
          cp dist/*.whl "${archive}/dist/"
          cp scripts/install-release.sh "${archive}/install.sh"
          cp -R config.example.toml eval skills packaging scripts README.md LICENSE "${archive}/"
          test -x "${archive}/install.sh"
          test -f "${archive}/share/cortana/web/index.html"
          test -n "$(find "${archive}/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          "${archive}/install.sh" --help
          test -x "${archive}/scripts/backup-restore-drill.sh"
          "${archive}/scripts/backup-restore-drill.sh" --help
          tar -czf "${archive}.tar.gz" "${archive}"
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          scripts/verify-release.sh "${archive}.tar.gz" "${archive}.tar.gz.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" cortana-*.tar.gz cortana-*.sha256 --clobber

  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: Linux x64
            args: ''
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: Windows x64
            args: ''
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CORTANA_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare macOS signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing required macOS signing secret: $name" >&2
              exit 1
            fi
          done

          api_key_path="$RUNNER_TEMP/cortana-apple/AuthKey.p8"
          if [[ -n "${APPLE_API_KEY_BASE64:-}" ]]; then
            [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_ISSUER:-}" ]] || {
              echo "APPLE_API_KEY_BASE64 requires APPLE_API_KEY and APPLE_API_ISSUER" >&2
              exit 1
            }
            mkdir -p "$(dirname "$api_key_path")"
            API_KEY_PATH="$api_key_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["API_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          )
          PY
            chmod 600 "$api_key_path"
          elif [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "configure either App Store Connect API-key secrets or APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID" >&2
            exit 1
          fi
      - name: Cache Rust and Bun build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            apps/desktop/src-tauri/target
            third_party/glib-0.18.5/target
          key: >-
            ${{ runner.os }}-cortana-desktop-${{ matrix.target }}-
            ${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'bun.lock',
            'apps/desktop/package.json', 'apps/web/package.json',
            'third_party/glib-0.18.5/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cortana-desktop-${{ matrix.target }}-
            ${{ runner.os }}-cortana-desktop-
      - name: Build, sign, and upload desktop
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/cortana-apple/AuthKey.p8
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          tauriScript: bun tauri
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Verify macOS trust and stapling
        if: runner.os == 'macOS'
        env:
          CORTANA_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          app="$(find "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name 'Cortana.app' -print -quit)"
          [[ -n "$app" ]] || { echo 'signed macOS application bundle not found' >&2; exit 1; }
          scripts/verify-macos-trust.sh "$app" "${CORTANA_VERSION#v}" arm64

  manifest:
    name: Generate updater manifest
    needs: [binaries, desktop]
    if: >-
      always() &&
      (needs.binaries.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Older releases may predate this helper; the release tag remains
          # the asset target while main supplies the maintained tooling.
          ref: main
      - name: Generate merged updater manifest
        # Keep the updater endpoint valid when one platform's package gate
        # fails. Missing targets are omitted from the manifest, so supported
        # platforms can still receive signed updates. The strict `verify` job
        # below remains fail-closed for an incomplete cross-platform release.
        run: >-
          python3 scripts/generate-updater-manifest.py "$RELEASE_TAG"
          --allow-partial --output "$RUNNER_TEMP/latest.json"
      - name: Upload merged updater manifest
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json" --repo "$GH_REPO" --clobber

  macos_trust:
    name: Verify macOS trust and stapling
    needs: [binaries, desktop, manifest]
    if: >-
      always() &&
      needs.binaries.result == 'success' &&
      needs.desktop.result == 'success' &&
      needs.manifest.result == 'success'
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CORTANA_REQUIRE_MINISIGN: '1'
      CORTANA_REQUIRE_GATEKEEPER: '1'
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the verifier current while the release tag remains the asset target.
          ref: main
      - name: Install minisign
        run: |
          if ! command -v minisign >/dev/null 2>&1; then
            brew install minisign
          fi
      - name: Verify published macOS package trust
        run: scripts/verify-macos-package.sh "$RELEASE_TAG"

  verify:
    name: Verify published release assets
    needs: [binaries, desktop, manifest, macos_trust]
    if: >-
      always() &&
      needs.binaries.result == 'success' &&
      needs.desktop.result == 'success' &&
      needs.manifest.result == 'success' &&
      needs.macos_trust.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
      - name: Verify cross-platform assets and updater manifest
        env:
          CORTANA_REQUIRE_MINISIGN: '1'
        run: scripts/verify-desktop-release.sh "$RELEASE_TAG"
