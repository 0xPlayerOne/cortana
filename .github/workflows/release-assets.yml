name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: Binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build release
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          bun install --frozen-lockfile
          bun run build
      - name: Package
        run: |
          archive="cortana-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "${archive}/bin" "${archive}/share/cortana"
          cp "target/${{ matrix.target }}/release/cortana" "${archive}/bin/"
          cp -R apps/web/dist "${archive}/share/cortana/web"
          cp -R config.example.toml skills packaging scripts README.md LICENSE "${archive}/"
          tar -czf "${archive}.tar.gz" "${archive}"
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" cortana-*.tar.gz cortana-*.sha256 --clobber
