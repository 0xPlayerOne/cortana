name: Code Foundry

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    uses: 0xPlayerOne/code-foundry/.github/workflows/draft-pr.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runner: ubuntu-slim
    secrets: inherit
