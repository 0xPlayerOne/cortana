name: Code Foundry

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Coalesce rapid staging updates into one release-PR reconciliation. The
# newest staging commit is the only one that should drive Release Please.
concurrency:
  group: cortana-release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Release PR
    uses: 0xPlayerOne/code-foundry/.github/workflows/release-pr.yml@v0.34.14
    with:
      runner: ubuntu-slim
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
