name: Code Foundry

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  packages: read
  security-events: write

jobs:
  release-pr:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release-please--branches--main')
    name: Release PR
    uses: 0xPlayerOne/code-foundry/.github/workflows/release-pr.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runner: ubuntu-slim
    secrets: inherit

  ci:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main')
    name: CI
    uses: 0xPlayerOne/code-foundry/.github/workflows/ci.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
      runner: ubuntu-latest
    secrets: inherit

  test:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main')
    name: Test
    uses: 0xPlayerOne/code-foundry/.github/workflows/test.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
      runner: ubuntu-latest
      unit-runner: ubuntu-slim
    secrets: inherit

  security:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main')
    name: Security
    uses: 0xPlayerOne/code-foundry/.github/workflows/security.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
      runner: ubuntu-slim
    secrets: inherit

  codeql:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main')
    name: CodeQL
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: 3c8eeb29b2984e98e2604fbb6a86d3df72f1c0b2
      runner: ubuntu-latest
    secrets: inherit
