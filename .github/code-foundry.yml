version: 1
profile: application
languages: rust,python,typescript
features: all
codeql: auto
dependency_review: auto
package_manager: bun
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v0.37.1
runner: ubuntu-latest
unit_runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
toolchain: auto
security_runner: ubuntu-slim
codeql_runner: ubuntu-latest
pr_runner: ubuntu-slim
release_runner: ubuntu-slim
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: rust
npm_publish: false
license: agpl-3.0-or-later
git_workflow: direct
merge_strategy: rebase
post_release: false
post_release_workflow:
post_release_mode: auto
opencode_security: false
sync_mode: overlay
custom_workflows: preserve
# Shard Rust CodeQL by manifest path; parallel shards cut wall-clock time at
# the cost of extra concurrent runners.
codeql_rust_shards: '["src","apps/desktop/src-tauri","third_party/glib-0.18.5"]'
codeql_rust_threads: 2
codeql_rust_max_parallel: 3
release_merge_strategy: rebase
